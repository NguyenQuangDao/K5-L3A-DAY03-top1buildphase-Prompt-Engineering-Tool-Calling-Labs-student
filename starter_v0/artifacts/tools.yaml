# Tool declarations for the research agent. Keep tool names synchronized with
# tools/__init__.py and the evaluation cases if a tool is ever renamed.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >-
      Asks the user for essential information that is missing or ambiguous, or
      asks for explicit yes/no confirmation before an external action. Use only
      when a required detail is missing or confirmation is needed. Do not use
      when the request is clear and sufficiently specified; call the relevant
      research tool instead.
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Concise question asking for the missing detail or explicit confirmation."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Use text for missing information, yes_no for action confirmation, or choice when offering listed options."}
        options: {type: array, default: [], items: {type: string}, description: "Options to present when response_type is choice."}
      required: [question]

  - name: timeline
    description: >-
      Retrieves recent posts from one social media account. Use when the user
      asks what a specific person or account posted. Do not use for searching
      posts by many people about a topic; use social_search for that. Do not
      guess an unidentified account; call clarify when the account is missing.
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Account handle without @, for example sama or elonmusk."}
        limit: {type: integer, default: 5, description: "Maximum number of recent posts to retrieve; preserve the user's requested count."}
      required: [screenname]

  - name: social_search
    description: >-
      Searches social media posts by topic across accounts. Use when the user
      asks what people are saying about a subject, including popular or recent
      posts. Do not use for posts from one specific account (use timeline) or
      for web news (use lookup).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "The topic or keywords to search; keep the query focused on the subject."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Only Top or Latest. Use Top for popular/top posts; otherwise use Latest."}
        limit: {type: integer, default: 5, description: "Maximum number of posts to retrieve; preserve the user's requested count."}
      required: [query]

  - name: lookup
    description: >-
      Searches the web for general information or news. Use for web research
      when the user has not supplied a specific URL; set topic to news for
      news requests and general for other web research. Do not use for social
      media post searches (use social_search) or to read a supplied URL (use
      fetch).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Focused subject or keywords to search on the web."}
        topic: {type: string, enum: [general, news], default: "general", description: "Use news for news requests and general for other web research."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Allowed values are day, week, month, or year. Map today to day and this week to week; honor an explicit period."}
        max_results: {type: integer, default: 5, description: "Maximum number of web results to retrieve."}
      required: [query]

  - name: fetch
    description: >-
      Retrieves and reads content from a specific URL supplied by the user.
      Use when the user asks to read or summarize an available link. Do not use
      to discover a URL or invent a missing one; call clarify for a missing URL.
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "The exact URL supplied by the user; do not substitute or fabricate a URL."}
      required: [url]

  - name: format
    description: >-
      Formats a list of posts or research items already provided or retrieved
      into a digest, sections, bullets, or a thread. Use when the source items
      are available and the user asks to organize or present them. Do not use
      to search for, retrieve, or invent items.
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Existing items to format; do not invent missing items."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Output format requested by the user; use a supported value."}
        headline: {type: string, default: "", description: "Optional title for the formatted output."}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: >-
      Sends text to the configured Telegram destination, which is an external
      action. Use only after the user has explicitly confirmed this specific
      send and set confirmed=true. Do not use to draft a message, to provide an
      ordinary answer, or before confirmation; call clarify with response_type
      yes_no first and wait for the user's answer.
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "The exact content the user requested to send."}
        confirmed: {type: boolean, default: false, description: "Must be true only after the user explicitly confirms this specific send; otherwise do not call send."}
      required: [text]

  - name: policy
    description: >-
      Searches the local company policy documents for relevant guidance. Use
      when the user asks about internal research, citation, privacy, publishing,
      or tool-use policies. Do not use for general public web information or
      research unrelated to the local policy documents.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Question or keywords to find in the company policies."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Relevant policy category, or all when no category is specified."}
        top_k: {type: integer, default: 3, description: "Maximum number of relevant policy passages to return."}
      required: [query]

  - name: papers
    description: >-
      Searches arXiv for academic papers. Use when the user requests scholarly
      papers or research publications. Do not use for ordinary web news or
      general social media discussion.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Research topic or keywords for arXiv."}
        max_results: {type: integer, default: 5, description: "Maximum number of papers to return; preserve the user's requested count."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Supported arXiv ordering: relevance, lastUpdatedDate, or submittedDate."}
      required: [query]

  - name: paper_text
    description: >-
      Retrieves and extracts text from an arXiv paper PDF. Use when the user
      asks to read or inspect a specific paper and provides its arXiv ID or
      URL. Do not use to search for papers (use papers) or when no paper
      identifier or URL is available; clarify first.
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "Specific arXiv ID or URL supplied by the user."}
        max_pages: {type: integer, default: 5, description: "Maximum number of PDF pages to extract."}
        max_chars: {type: integer, default: 8000, description: "Maximum number of extracted characters to return."}
      required: [arxiv_url]

  # ---------------- Team tools (người B) ----------------
  - name: hn_search
    description: >-
      Tìm bài (story) trên Hacker News — cộng đồng lập trình viên/startup — kèm số điểm và số bình luận.
      DÙNG KHI: user nhắc Hacker News / HN, hoặc hỏi dân tech/developer đang bàn gì về một chủ đề.
      KHÔNG DÙNG cho Twitter/X (dùng social_search), tin tức báo chí chung (dùng lookup với topic=news),
      hay khi user đưa sẵn URL (dùng fetch).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm, ngắn gọn, nên bằng tiếng Anh (vd 'LLM agents'). Không để trống."}
        sort: {type: string, enum: [relevance, date], default: "relevance", description: "relevance = nổi bật/liên quan nhất (mặc định); date = mới nhất, dùng khi user nói 'mới nhất', 'gần đây nhất'."}
        timeframe: {type: string, enum: [day, week, month, year, all], default: "all", description: "Giới hạn thời gian đăng: 'hôm nay'=day, 'tuần này'=week, 'tháng này'=month, 'năm nay'=year. Không nói gì = all."}
        limit: {type: integer, default: 5, description: "Số bài cần lấy, 1-20. Dùng đúng con số user yêu cầu."}
      required: [query]

  - name: wiki
    description: >-
      Lấy đoạn tóm tắt mở đầu của bài Wikipedia phù hợp nhất với từ khóa.
      DÙNG KHI: user hỏi định nghĩa / kiến thức nền ổn định ("X là gì?", "giải thích khái niệm X", tiểu sử, lịch sử).
      KHÔNG DÙNG cho tin tức hay sự kiện gần đây (dùng lookup với topic=news), paper khoa học (dùng papers),
      hay câu hỏi tính toán/lập trình nằm ngoài phạm vi research.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Tên khái niệm/thực thể cần tra, ngắn gọn (vd 'Retrieval-augmented generation'). Không để trống."}
        lang: {type: string, enum: [en, vi], default: "en", description: "Ngôn ngữ Wikipedia. Mặc định en (bài đầy đủ hơn); chỉ dùng vi khi user yêu cầu nguồn Wikipedia tiếng Việt."}
        max_results: {type: integer, default: 1, description: "Số bài, 1-5. Mặc định 1 cho câu hỏi định nghĩa."}
      required: [query]

  - name: github_repos
    description: >-
      Tìm repository mã nguồn mở trên GitHub, mặc định xếp theo số sao.
      DÙNG KHI: user tìm repo, thư viện, framework, project open-source, code mẫu trên GitHub.
      KHÔNG DÙNG để tìm model AI đã train sẵn (dùng hf_models), paper (dùng papers), hay tin tức (dùng lookup).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa chủ đề repo, không chứa tên ngôn ngữ (vd 'llm agent framework'). Không để trống."}
        language: {type: string, default: "", description: "Ngôn ngữ lập trình nếu user nêu rõ, viết thường (vd 'python', 'typescript', 'rust'). Không nêu thì để trống."}
        sort: {type: string, enum: [stars, updated, best_match], default: "stars", description: "Luôn truyền tường minh tham số sort: stars = nhiều sao/phổ biến nhất (mặc định khi user không yêu cầu tiêu chí khác); updated = mới cập nhật gần đây; best_match = liên quan nhất."}
        limit: {type: integer, default: 5, description: "Số repo, 1-20. Dùng đúng con số user yêu cầu."}
      required: [query, sort]

  - name: hf_models
    description: >-
      Tìm model AI trên Hugging Face Hub, kèm task, lượt tải và lượt thích.
      DÙNG KHI: user tìm model / checkpoint / weights có sẵn để dùng (vd 'model nhận dạng giọng nói', 'model Qwen nào tải nhiều nhất').
      KHÔNG DÙNG để tìm paper (dùng papers), repo code (dùng github_repos), hay tin tức về model (dùng lookup với topic=news).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa trong tên model hoặc tên hãng (vd 'qwen', 'whisper', 'llama'). Có thể để trống nếu đã có task."}
        task: {type: string, default: "", description: "Pipeline tag của Hugging Face nếu user nêu loại việc: text-generation, automatic-speech-recognition, text-to-image, feature-extraction (embedding), translation, image-classification. Không rõ thì để trống."}
        sort: {type: string, enum: [downloads, likes, trending, recent], default: "downloads", description: "downloads = tải nhiều nhất (mặc định); likes = nhiều like nhất; trending = đang hot; recent = mới đăng."}
        limit: {type: integer, default: 5, description: "Số model, 1-20. Dùng đúng con số user yêu cầu."}
      required: [query]

# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO(student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- Team tools (người B) ----------------
  - name: hn_search
    description: >-
      Tìm bài (story) trên Hacker News — cộng đồng lập trình viên/startup — kèm số điểm và số bình luận.
      DÙNG KHI: user nhắc Hacker News / HN, hoặc hỏi dân tech/developer đang bàn gì về một chủ đề.
      KHÔNG DÙNG cho Twitter/X (dùng social_search), tin tức báo chí chung (dùng lookup với topic=news),
      hay khi user đưa sẵn URL (dùng fetch).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm, ngắn gọn, nên bằng tiếng Anh (vd 'LLM agents'). Không để trống."}
        sort: {type: string, enum: [relevance, date], default: "relevance", description: "relevance = nổi bật/liên quan nhất (mặc định); date = mới nhất, dùng khi user nói 'mới nhất', 'gần đây nhất'."}
        timeframe: {type: string, enum: [day, week, month, year, all], default: "all", description: "Giới hạn thời gian đăng: 'hôm nay'=day, 'tuần này'=week, 'tháng này'=month, 'năm nay'=year. Không nói gì = all."}
        limit: {type: integer, default: 5, description: "Số bài cần lấy, 1-20. Dùng đúng con số user yêu cầu."}
      required: [query]

  - name: wiki
    description: >-
      Lấy đoạn tóm tắt mở đầu của bài Wikipedia phù hợp nhất với từ khóa.
      DÙNG KHI: user hỏi định nghĩa / kiến thức nền ổn định ("X là gì?", "giải thích khái niệm X", tiểu sử, lịch sử).
      KHÔNG DÙNG cho tin tức hay sự kiện gần đây (dùng lookup với topic=news), paper khoa học (dùng papers),
      hay câu hỏi tính toán/lập trình nằm ngoài phạm vi research.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Tên khái niệm/thực thể cần tra, ngắn gọn (vd 'Retrieval-augmented generation'). Không để trống."}
        lang: {type: string, enum: [en, vi], default: "en", description: "Ngôn ngữ Wikipedia. Mặc định en (bài đầy đủ hơn); chỉ dùng vi khi user yêu cầu nguồn Wikipedia tiếng Việt."}
        max_results: {type: integer, default: 1, description: "Số bài, 1-5. Mặc định 1 cho câu hỏi định nghĩa."}
      required: [query]

  - name: github_repos
    description: >-
      Tìm repository mã nguồn mở trên GitHub, mặc định xếp theo số sao.
      DÙNG KHI: user tìm repo, thư viện, framework, project open-source, code mẫu trên GitHub.
      KHÔNG DÙNG để tìm model AI đã train sẵn (dùng hf_models), paper (dùng papers), hay tin tức (dùng lookup).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa chủ đề repo, không chứa tên ngôn ngữ (vd 'llm agent framework'). Không để trống."}
        language: {type: string, default: "", description: "Ngôn ngữ lập trình nếu user nêu rõ, viết thường (vd 'python', 'typescript', 'rust'). Không nêu thì để trống."}
        sort: {type: string, enum: [stars, updated, best_match], default: "stars", description: "stars = nhiều sao/phổ biến nhất (mặc định); updated = mới cập nhật gần đây; best_match = liên quan nhất."}
        limit: {type: integer, default: 5, description: "Số repo, 1-20. Dùng đúng con số user yêu cầu."}
      required: [query]

  - name: hf_models
    description: >-
      Tìm model AI trên Hugging Face Hub, kèm task, lượt tải và lượt thích.
      DÙNG KHI: user tìm model / checkpoint / weights có sẵn để dùng (vd 'model nhận dạng giọng nói', 'model Qwen nào tải nhiều nhất').
      KHÔNG DÙNG để tìm paper (dùng papers), repo code (dùng github_repos), hay tin tức về model (dùng lookup với topic=news).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa trong tên model hoặc tên hãng (vd 'qwen', 'whisper', 'llama'). Có thể để trống nếu đã có task."}
        task: {type: string, default: "", description: "Pipeline tag của Hugging Face nếu user nêu loại việc: text-generation, automatic-speech-recognition, text-to-image, feature-extraction (embedding), translation, image-classification. Không rõ thì để trống."}
        sort: {type: string, enum: [downloads, likes, trending, recent], default: "downloads", description: "downloads = tải nhiều nhất (mặc định); likes = nhiều like nhất; trending = đang hot; recent = mới đăng."}
        limit: {type: integer, default: 5, description: "Số model, 1-20. Dùng đúng con số user yêu cầu."}
      required: [query]
